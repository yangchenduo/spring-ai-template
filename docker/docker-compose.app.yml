version: "3.9"

# ============================================================
#  Spring AI Template - Application Service
#  This file adds the app service to docker-compose
#  Usage: docker compose -f docker-compose.yml -f docker-compose.app.yml --profile app up -d
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/spring_ai
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      # -- Chat: OpenAI-compatible endpoint --
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      # -- Embedding: independent OpenAI-compatible endpoint (cloud default).
      #    For on-prem embedding point EMBEDDING_BASE_URL at a local /v1
      #    server (Ollama, vLLM, LocalAI) - no code or image change. --
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      # -- Raw uploaded files must live on a volume, not the container layer --
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_ROOT: /app/data/documents
      # -- Optional local chat server (--profile ollama); unused unless
      #    OPENAI_BASE_URL points at it --
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    volumes:
      - app_documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # ollama is intentionally not a dependency: it only exists behind the
      # "ollama" profile and is optional for on-prem chat/embeddings.
    networks:
      - ai-network
    profiles:
      - app

volumes:
  # Raw uploaded documents - survives container recreation
  app_documents:
