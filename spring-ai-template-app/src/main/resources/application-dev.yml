# ============================================================
#  Spring AI Template - Development Profile (OpenAI by default)
#  Use -Dspring.profiles.active=dev,ollama to enable Ollama
# ============================================================

spring:

  # ---- PostgreSQL ----
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  # ---- RabbitMQ ----
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  # ---- Spring AI Configuration ----
  ai:
    # Model selectors (Spring AI 2.x): the embedding selector picks the
    # EmbeddingModel that backs the vector store ("openai" here; the
    # "ollama" profile switches it to "ollama"). The chat selector is left
    # unset, so both chat models coexist and AiConfig binds the primary
    # ChatClient to the OpenAI-compatible endpoint via @Qualifier.
    model:
      embedding: openai

    # -- Ollama: local LLM, activate with profile "ollama" --
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        options:
          temperature: 0.7
          num-predict: 2048
      embedding:
        model: nomic-embed-text

    # -- OpenAI / compatible provider (default) --
    # Credentials are injected from the environment (root .env, IDE run
    # configuration or shell). Never commit an api-key here.
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.7
      # Embedding for RAG. Requires the provider behind OPENAI_BASE_URL to
      # support the OpenAI /embeddings API; switch spring.ai.model.embedding
      # to "ollama" if it does not.
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: 1536

    # -- Vector Store (PGVector) --
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        initialize-schema: true

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ---- Logging (dev: more verbose) ----
logging:
  level:
    com.template: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.amqp: DEBUG
