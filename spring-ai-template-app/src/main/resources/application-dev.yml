# ============================================================
#  Spring AI Template - Development Profile
#  Chat and embedding each talk to an OpenAI-compatible endpoint (see .env)
# ============================================================

spring:

  # ---- PostgreSQL ----
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  # ---- RabbitMQ ----
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    listener:
      simple:
        # auto: ack on success, reject to DLQ on failure (default-requeue-rejected=false)
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 1

  # ---- Spring AI Configuration ----
  ai:
    # Embedding has exactly one path: the OpenAI-compatible endpoint below
    # (spring.ai.openai.embedding.*). Cloud by default; to keep embeddings
    # on-prem point EMBEDDING_BASE_URL at a local /v1 server (Ollama, vLLM,
    # LocalAI, ...) - no profile switch and no code change. The chat
    # selector is left unset so AiConfig keeps binding the primary ChatClient
    # to openAiChatModel via @Qualifier.
    model:
      embedding: openai

    # -- Ollama: optional local chat server, kept for experiments only --
    # The primary ChatClient is bound to openAiChatModel; to chat through
    # Ollama, point OPENAI_BASE_URL at http://localhost:11434/v1 instead.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
        options:
          temperature: 0.7
          num-predict: 2048

    # -- Chat: any OpenAI-compatible endpoint --
    # Credentials are injected from the environment (root .env, IDE run
    # configuration or shell). Never commit an api-key here.
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.7
      # -- Embedding: independent OpenAI-compatible endpoint with its own
      #    credentials. Defaults to SiliconFlow's free BAAI/bge-m3
      #    (1024 dims, 8K-token input).
      #    NOTE: do NOT set 'dimensions' here - bge models reject that
      #    parameter; on SiliconFlow only the Qwen/Qwen3-Embedding series
      #    supports it. The pgvector table width comes from EMBEDDING_DIMENSIONS.
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${EMBEDDING_API_KEY:}
        model: ${EMBEDDING_MODEL:BAAI/bge-m3}

    # -- Vector Store (PGVector): dimensions MUST match the embedding model --
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        table-name: vector_store
        initialize-schema: true

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ---- Logging (dev: more verbose) ----
logging:
  level:
    com.template: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.amqp: DEBUG
