# ============================================================
#  Spring AI Template - Main Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: spring-ai-template

  # ---- Local secrets (optional) ----
  # Picks up the project-root .env when present, so credentials never need to
  # be committed to application-dev.yml. Missing files are ignored and real
  # environment variables always take precedence over imported values.
  # "./" covers `java -jar` from the repo root; "../" covers
  # `mvnw spring-boot:run -pl spring-ai-template-app` (working directory is
  # the module folder).
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  # ---- File Upload ----
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # ---- Jackson (Jackson 3 in Boot 4; ISO-8601 date output is the default) ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ---- MyBatis-Plus ----
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- API Docs (SpringDoc / Swagger UI) ----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ---- Logging ----
logging:
  level:
    root: INFO
    com.template: DEBUG
    org.springframework.ai: DEBUG
