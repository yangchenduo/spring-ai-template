# ============================================================
#  Spring AI Template - Main Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: spring-ai-template

  # ---- File Upload ----
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # ---- Jackson ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# ---- MyBatis-Plus ----
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- Knife4j API Docs ----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# ---- Logging ----
logging:
  level:
    root: INFO
    com.template: DEBUG
    org.springframework.ai: DEBUG
