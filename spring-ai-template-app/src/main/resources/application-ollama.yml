# ============================================================
#  Spring AI Template - Ollama Profile
#  Activate: -Dspring.profiles.active=dev,ollama
#  This profile switches the vector-store embedding source to Ollama.
# ============================================================

spring:
  ai:
    # Switch the vector-store embedding source to Ollama (768-dim
    # nomic-embed-text). Both chat models stay available; the primary
    # ChatClient still targets the OpenAI-compatible endpoint.
    model:
      embedding: ollama

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
        options:
          temperature: 0.7
          num-predict: 4096
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        dimensions: 768
