# ============================================================
#  Spring AI Template - Ollama Profile
#  Activate: -Dspring.profiles.active=dev,ollama
#  This profile enables Ollama as the AI provider.
# ============================================================

spring:
  ai:

    ollama:
      enabled: true
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
        options:
          temperature: 0.7
          num-predict: 4096
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    openai:
      enabled: false

    vectorstore:
      pgvector:
        dimensions: 768
