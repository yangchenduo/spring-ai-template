# ============================================================
#  Spring AI Template - Production Profile
#  Use environment variables for all sensitive config
#  Default: OpenAI-compatible cloud endpoints. To keep embeddings on-prem,
#  point EMBEDDING_BASE_URL at a local /v1 server (Ollama, vLLM, LocalAI).
# ============================================================

spring:

  # ---- PostgreSQL ----
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/spring_ai}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 60000
      connection-timeout: 10000

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # ---- RabbitMQ ----
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    listener:
      simple:
        # auto: ack on success, reject to DLQ on failure (default-requeue-rejected=false)
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 5

  # ---- Spring AI ----
  ai:
    # Embedding: single path through the OpenAI-compatible endpoint below.
    model:
      embedding: openai

    # -- Ollama: optional local chat server, experiments only --
    # The primary ChatClient stays on openAiChatModel; to chat through an
    # on-prem server, point OPENAI_BASE_URL at its /v1 endpoint instead.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
        options:
          temperature: 0.7
          num-predict: 4096

    # -- Chat: any OpenAI-compatible endpoint (env-switchable, no default key) --
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      # -- Embedding: independent OpenAI-compatible endpoint, defaults to
      #    SiliconFlow's BAAI/bge-m3. Do NOT set 'dimensions' for bge models
      #    (only the Qwen/Qwen3-Embedding series supports it on SiliconFlow).
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${EMBEDDING_API_KEY:}
        model: ${EMBEDDING_MODEL:BAAI/bge-m3}

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        table-name: vector_store
        initialize-schema: false

# ---- Actuator (prod: restricted) ----
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

# ---- Logging (prod: less verbose) ----
logging:
  level:
    root: WARN
    com.template: INFO
    org.springframework.ai: WARN
